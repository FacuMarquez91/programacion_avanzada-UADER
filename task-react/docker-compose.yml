services:
  db:
    image: postgres:17-alpine
    container_name: tareas_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    container_name: tareas_backend
    restart: unless-stopped

    environment:
      PORT: ${PORT}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

    ports:
      - "3000:3000"

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend

    container_name: tareas_frontend
    restart: unless-stopped

    environment:
      VITE_API_URL: http://localhost:3000/api/tareas

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  postgres_data: